services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
      POSTGRES_DB: schedule
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule"]
      interval: 3s
      timeout: 3s
      retries: 15
  migrate:
    build: ./backend
    command: ["python", "-m", "scheduling.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://schedule:schedule@db:5432/schedule
      PGOPTIONS: "-c timezone=UTC"
      SCENARIO_START_AT: "2026-01-01T00:00:00+00:00"
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://schedule:schedule@db:5432/schedule
      PGOPTIONS: "-c timezone=UTC"
      SCENARIO_START_AT: "2026-01-01T00:00:00+00:00"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  pgdata:
